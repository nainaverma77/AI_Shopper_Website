<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — AiShopper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-left">
    <a href="index.html">
      <div class="logo-wrap"><img src="assets/images/logo1.png" alt="AiShopper Logo" class="logo"></div>
      <span class="brand">AiShopper</span>
    </a>
  </div>
  <div class="nav-center">
    <div class="search-container">
      <input type="text" class="search-bar" id="searchBar" placeholder="Search products..." autocomplete="off">
      <span class="search-icon">🔍</span>
      <div class="search-suggestions" id="searchSuggestions"></div>
    </div>
  </div>
  <div class="nav-right">
    <a href="index.html" class="nav-icon" aria-label="Home" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">🏠</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☀️</button>
    <button class="nav-icon" data-action="wishlist">❤️<span class="badge" id="wishlistCount">0</span></button>
    <button class="nav-icon" data-action="cart">🛒<span class="badge" id="cartCount">0</span></button>
    <div class="account">
      <button class="nav-icon" id="accountBtn">👤</button>
      <div class="dropdown" id="accountMenu">
        <a href="login.html">🔐 Login / Sign Up</a>
      </div>
    </div>
  </div>
</nav>

<!-- PRODUCT DETAIL -->
<div class="product-page" id="productPage">
  <div class="product-container" id="productContainer">
    <!-- Filled by JS -->
  </div>

  <!-- Specifications -->
  <div class="product-details-section" id="specsSection" style="display:none">
    <h3>📋 Specifications</h3>
    <table class="specs-table" id="specsTable"></table>
  </div>

  <!-- Reviews -->
  <div class="reviews-section" id="reviewsSection">
    <h3>⭐ Customer Reviews</h3>

    <div class="rating-overview" id="ratingOverview"></div>

    <!-- Review Form -->
    <div class="review-form" id="reviewForm">
      <h4>Write a Review</h4>
      <div class="star-input" id="starInput">
        <span data-star="1">★</span>
        <span data-star="2">★</span>
        <span data-star="3">★</span>
        <span data-star="4">★</span>
        <span data-star="5">★</span>
      </div>
      <textarea id="reviewText" placeholder="Share your experience with this product..."></textarea>
      <button class="primary" id="submitReviewBtn">Submit Review</button>
    </div>

    <!-- Review List -->
    <div id="reviewList"></div>
  </div>

  <!-- Similar Products -->
  <div style="margin-top:32px">
    <h2>Similar Products</h2>
    <div class="grid" id="similarProducts"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-bottom">
    © 2026 AiShopper. All rights reserved. Frontend made by "Naina Verma"
  </div>
</footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/product-detail.js"></script>
</body>
</html>
